# Production deploy Compose — pulls a pre-built image (GHCR / Harbor / …).
#
# Single env source: repo-root `.env` (same as local / `.env.example`).
# Paths are relative to this file under `infra/docker/`.
#
# Object storage:
# - Default: no bundled MinIO. Point MINIO_* at SeaweedFS / real S3.
# - On this host, join `web-proxy` so API/worker can resolve `seaweed-s3:8333`
#   (same network as Nginx Proxy Manager). Example:
#     MINIO_ENDPOINT=seaweed-s3
#     MINIO_PORT=8333
#     MINIO_USE_SSL=false
#     MINIO_PUBLIC_URL=https://s3.example.com
# - Optional bundled MinIO: set COMPOSE_PROFILES=bundled-storage in `.env`.
#
# From repo root (local smoke or VPS checkout):
#   export IMAGE_REF=ghcr.io/owner/repo:sha-<fullsha>
#   printf 'IMAGE_REF=%s\n' "$IMAGE_REF" > .env.image
#   docker compose -f infra/docker/docker-compose.deploy.yml \
#     --env-file .env --env-file .env.image up -d
#
# Bake-from-source experiments: docker-compose.prod.example.yml

services:
  backend-api:
    image: ${IMAGE_REF:?Set IMAGE_REF to the published image ref}
    container_name: ${APP_NAME:-backend_api}-http
    env_file: ../../.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: 'mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?replicaSet=rs0&authSource=admin'
      REDIS_PORT: '6379'
      CLAMAV_PORT: '3310'
      # Bundled Compose Redis has no AUTH — clear any leftover ACL vars from .env
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ''
      # In-container listen must match healthcheck + nginx upstream (backend:3000).
      # Host/public PORT in .env is irrelevant behind the compose network.
      PORT: '3000'
      PROCESS_ROLE: api
      NODE_ENV: production
    volumes:
      - ../../keys:/app/keys:ro
    networks:
      backend_network:
        aliases:
          - backend
      # Reach SeaweedFS S3 (seaweed-s3) / NPM on the shared edge network
      web-proxy: {}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend-worker:
    image: ${IMAGE_REF:?Set IMAGE_REF to the published image ref}
    container_name: ${APP_NAME:-backend_api}-worker
    env_file: ../../.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: 'mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?replicaSet=rs0&authSource=admin'
      REDIS_PORT: '6379'
      CLAMAV_PORT: '3310'
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ''
      PORT: '3000'
      PROCESS_ROLE: worker
      NODE_ENV: production
    volumes:
      - ../../keys:/app/keys:ro
    healthcheck:
      disable: true
    networks:
      - backend_network
      - web-proxy

  mongo:
    image: mongo:6.0-jammy
    container_name: ${MONGO_NAME:-mongo_db}
    restart: unless-stopped
    entrypoint: ['/scripts/start-mongo.sh']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-admin}
    volumes:
      - mongo_keyfile:/mongo-keyfile:rw
      - ../scripts/start-mongo.sh:/scripts/start-mongo.sh:ro
      - mongo_data:/data/db
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: ${REDIS_NAME:-redis_cache}
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    profiles: [bundled-storage]
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    container_name: ${MINIO_NAME:-minio_storage}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001" --address ":9000"
    volumes:
      - minio_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 30s
      timeout: 10s
      retries: 5

  minio-init:
    profiles: [bundled-storage]
    image: minio/mc:latest
    container_name: MINIO_INITIALIZER
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/scripts/init-minio.sh']
    restart: on-failure
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_APP_BUCKET: ${MINIO_APP_BUCKET:-app-uploads}
      MINIO_BACKUP_BUCKET: ${MINIO_BACKUP_BUCKET:-backups}
    volumes:
      - ../scripts/init-minio.sh:/scripts/init-minio.sh:ro
    networks:
      - backend_network

  # One-shot portfolio content bootstrap (NOT started by deploy).
  # Wipes portfolio CMS collections then inserts prisma/seed/data/*.json.
  # Usage (repo root on VPS, after stack is up):
  #   CONFIRM_PROD_SEED=yes docker compose -f infra/docker/docker-compose.deploy.yml \
  #     --env-file .env --env-file .env.image --profile seed run --rm portfolio-seed
  portfolio-seed:
    profiles: ['seed']
    image: ${IMAGE_REF:?Set IMAGE_REF to the published image ref}
    env_file: ../../.env
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    environment:
      DATABASE_URL: 'mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?replicaSet=rs0&authSource=admin'
      NODE_ENV: production
      CONFIRM_PROD_SEED: ${CONFIRM_PROD_SEED:-}
    entrypoint: ['node', '-r', 'module-alias/register', 'dist/scripts/seed-portfolio.js']
    networks:
      - backend_network

  # One-shot SUPER_ADMIN upsert (NOT started by deploy). Pass secrets on the CLI only.
  #   CONFIRM_PROD_BOOTSTRAP_ADMIN=yes \
  #   BOOTSTRAP_ADMIN_EMAIL='...' BOOTSTRAP_ADMIN_PASSWORD='...' \
  #   BOOTSTRAP_ADMIN_FIRST_NAME='Barthez' BOOTSTRAP_ADMIN_LAST_NAME='Kenwou' \
  #   BOOTSTRAP_ADMIN_PHONE='...' BOOTSTRAP_ADMIN_AVATAR_URL='...' \
  #   docker compose -f infra/docker/docker-compose.deploy.yml \
  #     --env-file .env --env-file .env.image --profile bootstrap-admin \
  #     run --rm bootstrap-admin
  bootstrap-admin:
    profiles: ['bootstrap-admin']
    image: ${IMAGE_REF:?Set IMAGE_REF to the published image ref}
    env_file: ../../.env
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    environment:
      DATABASE_URL: 'mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?replicaSet=rs0&authSource=admin'
      NODE_ENV: production
      CONFIRM_PROD_BOOTSTRAP_ADMIN: ${CONFIRM_PROD_BOOTSTRAP_ADMIN:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-Barthez}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-Kenwou}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      BOOTSTRAP_ADMIN_AVATAR_URL: ${BOOTSTRAP_ADMIN_AVATAR_URL:-}
    entrypoint: ['node', '-r', 'module-alias/register', 'dist/scripts/bootstrap-super-admin.js']
    networks:
      - backend_network

  nginx:
    image: nginx:stable-alpine
    container_name: ${NGINX_NAME:-nginx}
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend_network
      - web-proxy

  clamav:
    image: clamav/clamav:1.0.9
    container_name: ${CLAMAV_NAME:-clamav}
    environment:
      - CLAMAV_NO_CLAMD=false
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMD_STARTUP_TIMEOUT=600
    volumes:
      - clamav_data:/var/lib/clamav
      - ../monitoring/clamav/clamd.conf:/etc/clamav/clamd.conf
      - clamav_logs:/var/log/clamav
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'clamdscan', '--version']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    command: ['sh', '-c', 'freshclam --daemon --stdout && clamd --foreground']
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_keyfile:
  minio_data:
  clamav_data:
  clamav_logs:

networks:
  backend_network:
    driver: bridge
    attachable: true
  web-proxy:
    external: true
    name: web-proxy
