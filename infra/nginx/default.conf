upstream backend_api {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # API multipart is avatars only (2MB). Large objects use presigned PUT to MinIO.
    client_max_body_size 2m;

    location /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # CSRF token for browser SPA (csurf cookie + X-XSRF-TOKEN header).
    location = /csrf-token {
        proxy_pass http://backend_api/csrf-token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Login/refresh set Set-Cookie (JWT) + many security headers; default 4k/8k
        # proxy_buffer_size yields "upstream sent too big header" → Cloudflare 502.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 16k;
    }

    # /metrics, /api-docs, and /admin are not public. Scrape/operator UIs
    # must hit the API container on the private network.
    location / {
        return 404;
    }
}
