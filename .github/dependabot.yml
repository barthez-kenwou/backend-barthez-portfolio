version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-deps:
        dependency-type: production
      development-deps:
        dependency-type: development
        exclude-patterns:
          # Mega-group bumps of typescript break npm ci / type-check until
          # typescript-eslint supports TS 7 (peer still <6.1.0). Keep TS on ~5.9.
          - 'typescript'
          - '@typescript-eslint/*'
          - 'prisma'
          - '@prisma/client'
    ignore:
      # typescript-eslint has no TS 7 compiler API yet — do not auto-bump majors.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # Vitest 4/5 is a dedicated upgrade (GHSA-82fw-gwwq-j7x9).
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
