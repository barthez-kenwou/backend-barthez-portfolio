name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Requires Dependency graph enabled:
      # Settings → Security → Code security → Dependency graph.
      # Until then the action fails with "not supported on this repository".
      - id: review
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
      - name: Surface dependency-review outcome
        if: steps.review.outcome == 'failure'
        run: |
          echo "::warning::dependency-review-action failed. If the log says Dependency graph is not enabled, turn it on under Settings → Security → Code security (then re-run). Other failures (high+ vulns in the PR) are real and must be fixed."
          # Soft-fail until graph is enabled so PR CI is not blocked by missing org settings.
          # Set repo variable DEPENDENCY_REVIEW_ENFORCE=true once the graph works.
          if [ "${{ vars.DEPENDENCY_REVIEW_ENFORCE }}" = "true" ]; then
            exit 1
          fi
          exit 0
