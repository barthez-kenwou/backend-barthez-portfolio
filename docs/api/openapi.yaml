openapi: 3.0.3
info:
  title: 'Barthez Kenwou Portfolio API'
  description: "Backend for https://barthez-kenwou.dev — public portfolio content and\n`/barthez-admin` CMS (projects, blogs, skills, CV, contact, testimonials).\n\nPlatform: RS256 JWT auth (OTP + optional TOTP), OAuth 2.0, RBAC, MinIO/S3 uploads,\nRedis, BullMQ, Flagsmith, audit, and operator surfaces.\n\n**Authentication:** `Authorization: Bearer <access_token>` on protected routes.\nRefresh tokens use an HTTP-only cookie; `/auth/refresh` also accepts `refreshToken` in JSON.\n\n**Base paths:** domain APIs under `/api/v1`. System endpoints (`/health`, `/csrf-token`,\n`/metrics`, CSP report URI, Bull Board) are at the application root.\n\n**Public vs admin:** most list/get endpoints are public (published filters).\nMutations require verified admin permissions. Contact form and testimonial feedback are public POSTs."
  version: 1.0.0
  contact:
    name: 'Barthez Kenwou'
    email: contact@barthez-kenwou.dev
    url: 'https://barthez-kenwou.dev'
  license:
    name: UNLICENSED
    url: 'https://barthez-kenwou.dev'
servers:
  -
    url: 'http://localhost:3000'
    description: 'Local development'
  -
    url: 'https://api.barthez-kenwou.dev'
    description: 'Production (when deployed)'
tags:
  -
    name: Authentication
    description: 'Signup, OTP, login, refresh, password flows, current user (`/me`), sessions, and optional TOTP'
  -
    name: OAuth
    description: 'Social login (redirect providers + Telegram widget), account linking and unlinking'
  -
    name: Users
    description: 'Self-service profile and admin user lifecycle (invite, activate, unlock, export, GDPR delete)'
  -
    name: Blogs
    description: 'Bilingual portfolio blog posts (FR/EN) with publish flag'
  -
    name: Projects
    description: 'Portfolio case studies with featured / published / confidential flags'
  -
    name: Services
    description: 'Offered services and pricing (EUR source of truth)'
  -
    name: Skills
    description: 'Skill matrix (name, category, level, icon)'
  -
    name: Experiences
    description: 'Professional experiences for CV and About'
  -
    name: Education
    description: 'Education entries for CV'
  -
    name: Certifications
    description: 'Certifications for Skills page and CV'
  -
    name: Testimonials
    description: 'Public testimonials + feedback form with moderation'
  -
    name: Achievements
    description: 'Highlight counters shown on the Skills page'
  -
    name: References
    description: 'Professional references (PII — admin / CV aggregate)'
  -
    name: Languages
    description: 'Spoken languages for the CV'
  -
    name: ContactInfos
    description: 'Singleton public profile / contact card'
  -
    name: ContactResponses
    description: 'Inbound contact-form messages (public POST, admin inbox)'
  -
    name: CV
    description: 'Aggregated CV payload for the public resume page / PDF'
  -
    name: Files
    description: 'Presigned object-storage URLs for large uploads/downloads'
  -
    name: System
    description: 'Health, CSRF, metrics, CSP, audit, admin dashboard counts, and Bull Board'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token issued by login, verify, refresh, or OAuth flows'
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic for operator UIs (ADMIN_BASIC_* , fallback SWAGGER_*)'
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        isVerified:
          type: boolean
        role:
          type: string
          enum:
            - admin
            - user
            - guest
            - super-admin
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Blog:
      type: object
      description: 'Bilingual portfolio blog post (FR/EN) with publish flag'
      properties:
        id:
          type: string
        slug:
          type: string
        titleFr:
          type: string
        titleEn:
          type: string
        excerptFr:
          type: string
        excerptEn:
          type: string
        contentFr:
          type: string
        contentEn:
          type: string
        image:
          type: string
        category:
          type: string
        date:
          type: string
          format: date-time
        readTime:
          type: string
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        isPublished:
          type: boolean
        authorId:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: 'May also be set as an HTTP-only cookie'
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
    OAuthAccount:
      type: object
      properties:
        provider:
          type: string
          enum:
            - google
            - github
            - facebook
            - instagram
            - twitter
            - linkedin
            - telegram
          description: 'Linked OAuth account provider'
        providerUserId:
          type: string
        email:
          type: string
          format: email
          nullable: true
        linkedAt:
          type: string
          format: date-time
    SessionFamily:
      type: object
      properties:
        familyId:
          type: string
          description: 'Refresh-token family identifier'
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        userAgent:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
    TotpEnrollment:
      type: object
      properties:
        otpauthUrl:
          type: string
          description: 'otpauth:// URI for authenticator apps (shown once)'
        secret:
          type: string
          description: 'Base32 TOTP secret (shown once; store offline if needed)'
    AuditLogEntry:
      type: object
      description: 'Audit list row (metadata omitted for list payloads)'
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        actorId:
          type: string
          nullable: true
        action:
          type: string
          example: user.role.changed
        resource:
          type: string
          example: user
        resourceId:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    AuditLogDetail:
      allOf:
        -
          $ref: '#/components/schemas/AuditLogEntry'
        -
          type: object
          description: 'Full audit entry including request metadata'
          properties:
            userAgent:
              type: string
              nullable: true
            metadata:
              type: object
              nullable: true
              additionalProperties: true
              description: 'Domain-specific context captured at write time'
  responses:
    BadRequest:
      description: 'Validation failed or malformed request'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 'Missing or invalid authentication'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Authenticated but lacking required permission or role'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 'Resource not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 'Conflict with existing resource state'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: 'Semantic error (invalid or expired token)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 'Rate limit or account lockout'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: 'Unexpected server error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /api/v1/auth/signup:
    post:
      tags:
        - Authentication
      summary: 'Register a new user'
      description: 'Creates a user account and sends an email OTP for verification. Optional profile image via multipart field `profile`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
                - phone
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: 'Must include uppercase, lowercase, number, and symbol'
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                  minLength: 5
                  maxLength: 20
                profile:
                  type: string
                  format: binary
                  description: 'Optional avatar image'
      responses:
        '201':
          description: 'User created; OTP sent to email'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/User'}}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/verify:
    post:
      tags:
        - Authentication
      summary: 'Verify account with OTP'
      description: 'Confirms the email OTP and returns an authenticated session (JWT pair).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 4
                  maxLength: 8
      responses:
        '200':
          description: 'Account verified; tokens issued'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/TokenPair'}}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/resend-otp:
    post:
      tags:
        - Authentication
      summary: 'Resend verification OTP'
      description: 'Sends a new one-time password when the account exists and is unverified. Enforces OTP_RESEND_COOLDOWN (default 60s) after the previous issue. Unknown / already-verified emails still return 200 (no enumeration).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 'Accepted (OTP sent when applicable)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: 'Login with email and password'
      description: 'Authenticates credentials and issues a JWT access token plus refresh cookie/token.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                totpCode:
                  type: string
                  minLength: 6
                  maxLength: 8
                  description: 'Required when TOTP is enabled on the account'
      responses:
        '200':
          description: 'Login successful'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/TokenPair'}}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: 'Refresh access token'
      description: 'Issues a new access token using the refresh token from the HTTP-only cookie or JSON body field `refreshToken`.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: 'Optional when the refresh cookie is present'
      responses:
        '200':
          description: 'Token refreshed'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/TokenPair'}}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: 'Request password reset'
      description: 'Always returns the same success payload. A single-use opaque token is emailed only when the account exists (no user enumeration).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 'Generic accepted response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: 'Reset password with token'
      description: 'Consumes a single-use opaque `resetToken` from the email (JSON body, not the URL) and revokes all sessions.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - new_password
              properties:
                resetToken:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  description: 'Must include uppercase, lowercase, number, and symbol'
      responses:
        '200':
          description: 'Password reset successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: 'Logout and revoke session'
      description: 'Clears the refresh cookie, blacklists the access `jti`, and revokes the refresh family. Account `isActive` is unchanged. Requires a verified user.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Logged out'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/change-password:
    post:
      tags:
        - Authentication
      summary: 'Change password (authenticated)'
      description: 'Updates the password for the current verified, active user.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  description: 'Must include uppercase, lowercase, number, and symbol'
      responses:
        '200':
          description: 'Password changed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: 'Current user'
      description: 'Returns a fresh account snapshot including roles and permissions (not JWT claims alone). Requires a verified account.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Current user'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/User'}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/sessions:
    get:
      tags:
        - Authentication
      summary: 'List sessions'
      description: 'Refresh-token families for the authenticated user. Requires verified + active account.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Session list'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/SessionFamily'}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/api/v1/auth/sessions/{familyId}':
    delete:
      tags:
        - Authentication
      summary: 'Revoke a session family'
      description: 'Revokes one device/session family. Requires verified + active account.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: familyId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: 'Refresh-token family id from GET /auth/sessions'
      responses:
        '200':
          description: 'Session revoked'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/totp/enroll:
    post:
      tags:
        - Authentication
      summary: 'Start TOTP enrollment'
      description: 'Returns an otpauth URL and secret once. TOTP is not enabled until confirm. Requires verified + active account.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Enrollment started'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/TotpEnrollment'}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/totp/confirm:
    post:
      tags:
        - Authentication
      summary: 'Confirm TOTP enrollment'
      description: 'Enables TOTP after verifying a code from the authenticator app.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - totpCode
              properties:
                totpCode:
                  type: string
                  minLength: 6
                  maxLength: 8
                  description: 'Time-based one-time password from the authenticator app'
      responses:
        '200':
          description: 'TOTP enabled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/totp/recovery-codes:
    post:
      tags:
        - Authentication
      summary: 'Generate TOTP recovery codes'
      description: 'Generates 8 one-time recovery codes shown exactly once. Invalidates any previous set. TOTP must already be enabled.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Recovery codes (shown once — store them securely)'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {type: object, properties: {codes: {type: array, items: {type: string}}}}}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/totp/recover:
    post:
      tags:
        - Authentication
      summary: 'Login with TOTP recovery code'
      description: 'Authenticates with email + password + a one-time recovery code instead of the authenticator app. Single-use: each code is consumed on success. Use when the authenticator device is lost.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - recoveryCode
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                recoveryCode:
                  type: string
                  minLength: 10
                  maxLength: 10
                  description: '10-character hex recovery code from the generated set'
      responses:
        '200':
          description: 'Login successful'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/TokenPair'}}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/totp/disable:
    post:
      tags:
        - Authentication
      summary: 'Disable TOTP'
      description: 'Turns TOTP off. Requires current password and a valid authenticator code.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - totpCode
                - current_password
              properties:
                totpCode:
                  type: string
                  minLength: 6
                  maxLength: 8
                  description: 'Time-based one-time password from the authenticator app'
                current_password:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 'TOTP disabled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/oauth/accounts:
    get:
      tags:
        - OAuth
      summary: 'List linked OAuth accounts'
      description: 'Returns social accounts linked to the authenticated user.'
      security:
        -
          bearerAuth: []
      responses:
