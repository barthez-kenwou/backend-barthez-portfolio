      summary: 'Update project'
      description: 'Requires `project:update:own` (owner) or `project:update:any`.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: projectId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
            example: 507f1f77bcf86cd799439011
            description: 'MongoDB ObjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                titleFr:
                  type: string
                  minLength: 2
                  maxLength: 300
                titleEn:
                  type: string
                  minLength: 2
                  maxLength: 300
                descriptionFr:
                  type: string
                  maxLength: 5000
                descriptionEn:
                  type: string
                  maxLength: 5000
                problemFr:
                  type: string
                  maxLength: 10000
                problemEn:
                  type: string
                  maxLength: 10000
                solutionFr:
                  type: array
                  items: {type: string}
                solutionEn:
                  type: array
                  items: {type: string}
                impactFr:
                  type: array
                  items: {type: string}
                impactEn:
                  type: array
                  items: {type: string}
                techStack:
                  description: 'Object or array describing the stack'
                  oneOf: [{type: object, additionalProperties: true}, {type: array}]
                images:
                  type: array
                  minItems: 1
                  items: {type: string}
                preview:
                  type: string
                  maxLength: 2000
                category:
                  type: string
                  maxLength: 120
                status:
                  type: string
                  maxLength: 80
                complexity:
                  type: string
                  maxLength: 80
                role:
                  type: string
                  maxLength: 200
                duration:
                  type: string
                  maxLength: 120
                date:
                  type: string
                  maxLength: 80
                isFeatured:
                  type: boolean
                isPublished:
                  type: boolean
                confidential:
                  type: boolean
                  description: 'When true, public responses redact github/demo (and similar) links'
                sortOrder:
                  type: integer
                  minimum: 0
                github:
                  type: string
                  nullable: true
                  maxLength: 2000
                demo:
                  type: string
                  nullable: true
                  maxLength: 2000
                fullDescriptionFr:
                  type: string
                  nullable: true
                fullDescriptionEn:
                  type: string
                  nullable: true
      responses:
        '200':
          description: 'Project updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Projects
      summary: 'Soft-delete project'
      description: 'Requires `project:delete:own` (owner) or `project:delete:any`.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: projectId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
            example: 507f1f77bcf86cd799439011
            description: 'MongoDB ObjectId'
      responses:
        '200':
          description: 'Project deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      tags:
        - System
      summary: 'Readiness (Mongo + Redis)'
      description: 'Used by Docker HEALTHCHECK. Returns 503 if a dependency is down.'
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '503':
          description: 'Dependency check failed'
  /health/live:
    get:
      tags:
        - System
      summary: Liveness
      description: 'Process is up. Does not check Mongo or Redis.'
      responses:
        '200':
          description: Live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /health/ready:
    get:
      tags:
        - System
      summary: 'Readiness alias'
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '503':
          description: 'Dependency check failed'
  /csrf-token:
    get:
      tags:
        - System
      summary: 'Issue CSRF token'
      description: 'Returns a CSRF token in JSON. The httpOnly csurf secret cookie is owned by middleware — this endpoint does not overwrite it.'
      responses:
        '200':
          description: 'CSRF token issued'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {type: object, properties: {csrfToken: {type: string}}}}}
        '500':
          $ref: '#/components/responses/ServerError'
  /metrics:
    get:
      tags:
        - System
      summary: 'Prometheus metrics'
      description: 'Exposes default Node.js process metrics in Prometheus text format. Requires HTTP Basic (ADMIN_BASIC_*, fallback SWAGGER_*) except in tests. Not published through public Nginx.'
      security:
        -
          basicAuth: []
      responses:
        '200':
          description: 'Prometheus metrics scrape payload'
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /security/csp-violation:
    post:
      tags:
        - System
      summary: 'CSP violation report URI'
      description: 'Receives Content-Security-Policy violation reports from browsers (POST). Mount path defaults to `CSP_REPORT_URI` (`/security/csp-violation`). GET is also accepted for legacy clients.'
      requestBody:
        required: false
        content:
          application/csp-report:
            schema:
              type: object
              properties:
                csp-report:
                  type: object
                  properties: {document-uri: {type: string}, referrer: {type: string}, blocked-uri: {type: string}, violated-directive: {type: string}, original-policy: {type: string}}
      responses:
        '204':
          description: 'Report accepted (no content)'
    get:
      tags:
        - System
      summary: 'CSP violation report URI (legacy GET)'
      description: 'Same handler as POST for clients that send reports with GET. Prefer POST.'
      responses:
        '204':
          description: 'Report accepted (no content)'
  /api/v1/admin/dashboard:
    get:
      tags:
        - System
      summary: 'Admin dashboard counts'
      description: 'Aggregate operator stats: published projects, published blogs, new contact responses, and pending testimonials. Requires JWT + verified active user with admin/super-admin role or `audit:read`.'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Dashboard counts'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {type: object, properties: {publishedProjects: {type: integer}, publishedBlogs: {type: integer}, newContactResponses: {type: integer}, pendingTestimonials: {type: integer}}}}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/audit:
    get:
      tags:
        - System
      summary: 'List audit log entries'
      description: 'Append-only security trail. Requires `audit:read`. Paginated (limit ≤ 100). Filter by actor, action, resource, requestId, and date range. List rows omit metadata — use `GET /admin/audit/{auditId}` for full detail.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: actorId
          in: query
          schema:
            type: string
          description: 'Filter by actor user id'
        -
          name: action
          in: query
          schema:
            type: string
          description: 'Exact action key (e.g. user.role.changed)'
        -
          name: resource
          in: query
          schema:
            type: string
          description: 'Resource type (e.g. user, blog)'
        -
          name: requestId
          in: query
          schema:
            type: string
          description: 'Correlate with `X-Request-Id` from application logs'
        -
          name: from
          in: query
          schema:
            type: string
            format: date-time
          description: 'Inclusive lower bound on `createdAt` (ISO-8601)'
        -
          name: to
          in: query
          schema:
            type: string
            format: date-time
          description: 'Inclusive upper bound on `createdAt` (ISO-8601)'
        -
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        -
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 'Paginated audit entries'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  data: {type: array, items: {$ref: '#/components/schemas/AuditLogEntry'}}
                  pagination: {$ref: '#/components/schemas/PaginationMeta'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/audit/export:
    get:
      tags:
        - System
      summary: 'Export audit log'
      description: 'Download matching entries as CSV or JSON (max 2000 rows; `X-Export-Truncated` when capped). Same filters as list. Requires `audit:read`. Response includes `Content-Disposition` and `X-Export-Count`. Not a mutation API — trail remains append-only; retention purge is cron-only.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: actorId
          in: query
          schema:
            type: string
          description: 'Filter by actor user id'
        -
          name: action
          in: query
          schema:
            type: string
          description: 'Exact action key (e.g. user.role.changed)'
        -
          name: resource
          in: query
          schema:
            type: string
          description: 'Resource type (e.g. user, blog)'
        -
          name: requestId
          in: query
          schema:
            type: string
          description: 'Correlate with `X-Request-Id` from application logs'
        -
          name: from
          in: query
          schema:
            type: string
            format: date-time
          description: 'Inclusive lower bound on `createdAt` (ISO-8601)'
        -
          name: to
          in: query
          schema:
            type: string
            format: date-time
          description: 'Inclusive upper bound on `createdAt` (ISO-8601)'
        -
          name: format
          in: query
          schema:
            type: string
            enum:
              - csv
              - json
            default: csv
          description: 'Export format (default csv)'
      responses:
        '200':
          description: 'Audit export download'
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogDetail'
          headers:
            X-Export-Count:
              description: 'Number of rows in this export (≤ 2000)'
              schema:
                type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/api/v1/admin/audit/{auditId}':
    get:
      tags:
        - System
      summary: 'Get audit entry by id'
      description: 'Full entry including `metadata` and `userAgent`. Requires `audit:read`.'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: auditId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
            example: 507f1f77bcf86cd799439011
            description: 'MongoDB ObjectId'
          description: 'AuditLog ObjectId'
      responses:
        '200':
          description: 'Audit entry detail'
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/AuditLogDetail'}}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/files/presign:
    post:
      tags:
        - Files
      summary: 'Create a presigned upload URL'
      description: 'Authenticated. Use for objects larger than the 2MB API multipart cap.'
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - filename
                - contentType
                - size
              properties:
                filename:
                  type: string
                contentType:
                  type: string
                size:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 'Presigned PUT URL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - Files
      summary: 'Create a presigned download URL'
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Presigned GET URL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/queues:
    get:
      tags:
        - System
      summary: 'Bull Board queue admin UI'
      description: 'Serves the Bull Board dashboard for mail, backup, maintenance, and heavy-task queues. Requires HTTP Basic (ADMIN_BASIC_*, fallback SWAGGER_*) plus a JWT for an admin or super-admin user. Not published through public Nginx.'
      security:
        -
          basicAuth: []
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Bull Board HTML UI'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
